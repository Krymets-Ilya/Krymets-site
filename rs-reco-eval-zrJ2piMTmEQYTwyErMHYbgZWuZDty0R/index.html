<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Recommendation Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f12;
      --panel: #16191e;
      --panel-2: #1d2128;
      --line: #303641;
      --text: #f3f5f7;
      --muted: #a8b0bc;
      --accent: #e9eef5;
      --danger: #ffb4ab;
      --ok: #b9f6ca;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { overflow-x: hidden; }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    main { width: min(100%, 980px); margin: 0 auto; padding: 20px 14px 120px; }
    h1 { font-size: 22px; margin: 0 0 22px; letter-spacing: -0.02em; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { font-size: 16px; margin: 0; }
    .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .seed { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .seed-title { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .seed-year { color: var(--muted); margin-top: 3px; }
    .profile-line { margin-top: 11px; font-size: 13px; line-height: 1.55; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .profile-label { color: var(--muted); display: block; margin-bottom: 2px; }
    .change-line { margin-top: 8px; font-weight: 700; min-height: 21px; }
    .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 20px; }
    .controls-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .reset { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); padding: 0 14px; }
    .reset:disabled { opacity: .4; }
    .slider-row { display: grid; grid-template-columns: 48px minmax(0,1fr) 30px; align-items: center; gap: 9px; min-height: 48px; }
    .slider-row label { font-size: 12px; font-weight: 800; letter-spacing: .04em; }
    .slider-row output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
    input[type="range"]:disabled { opacity: .35; }
    .target { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; }
    .status { min-height: 48px; display: flex; align-items: center; color: var(--muted); margin: 4px 0 14px; }
    .status.error { color: var(--danger); }
    .variant { margin: 0 0 24px; }
    .variant-head { margin-bottom: 8px; display: flex; align-items: baseline; justify-content: space-between; }
    .recommendation-list { display: grid; gap: 8px; }
    .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-width: 0; }
    .rec-title { font-size: 14px; font-weight: 750; line-height: 1.35; overflow-wrap: anywhere; }
    .rec-year { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .rec-profile { color: #d9dee5; font-size: 12px; line-height: 1.45; margin-top: 7px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .vote-wrap { position: sticky; bottom: 0; z-index: 5; margin: 18px -14px 0; padding: 12px 14px max(12px, env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
    .vote-question { font-size: 14px; font-weight: 700; line-height: 1.35; margin-bottom: 9px; }
    .vote-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 7px; }
    .vote { min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); padding: 6px; font-weight: 750; }
    .vote:disabled { opacity: .45; }
    .vote.selected { outline: 2px solid var(--accent); opacity: 1; }
    .saved { color: var(--ok); font-size: 13px; min-height: 20px; margin-top: 8px; }
    .next { width: 100%; min-height: 48px; border: 0; border-radius: 11px; background: var(--accent); color: #101216; font-weight: 800; margin-top: 8px; }
    .next:disabled { opacity: .35; }
    .footer-tools { margin-top: 30px; display: flex; justify-content: flex-end; }
    .export { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: transparent; font-size: 12px; }
    [hidden] { display: none !important; }
    @media (min-width: 720px) {
      main { padding: 34px 24px 130px; }
      .seed, .controls { padding: 18px; }
      .recommendation-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .vote-wrap { margin-left: 0; margin-right: 0; border: 1px solid var(--line); border-radius: 14px 14px 0 0; }
    }
  </style>
</head>
<body>
<main>
  <h1>Recommendation Test</h1>

  <section id="seedCard" class="seed" hidden>
    <div class="eyebrow">Базовый альбом</div>
    <div id="seedTitle" class="seed-title"></div>
    <div id="seedYear" class="seed-year"></div>
    <div class="profile-line">
      <span class="profile-label">Исходный профиль</span>
      <span id="sourceProfile"></span>
    </div>
    <div id="changeLine" class="change-line"></div>
  </section>

  <section id="controls" class="controls" hidden>
    <div class="controls-head">
      <div>
        <div class="eyebrow">Измените один параметр</div>
        <h2>Sound Profile</h2>
      </div>
      <button id="resetButton" class="reset" type="button" disabled>Сбросить</button>
    </div>
    <div id="sliders"></div>
    <div class="profile-line target">
      <span class="profile-label">Целевой профиль</span>
      <span id="targetProfile"></span>
    </div>
  </section>

  <div id="status" class="status">Загрузка теста…</div>

  <section id="results" hidden>
    <section class="variant">
      <div class="variant-head"><h3>Вариант A</h3></div>
      <div id="variantA" class="recommendation-list"></div>
    </section>
    <section class="variant">
      <div class="variant-head"><h3>Вариант B</h3></div>
      <div id="variantB" class="recommendation-list"></div>
    </section>
    <section class="variant">
      <div class="variant-head"><h3>Вариант C</h3></div>
      <div id="variantC" class="recommendation-list"></div>
    </section>
  </section>

  <section id="voteWrap" class="vote-wrap" hidden>
    <div class="vote-question">Какой набор лучше соответствует изменённому профилю?</div>
    <div class="vote-grid">
      <button class="vote" data-vote="A" type="button">A лучше</button>
      <button class="vote" data-vote="B" type="button">B лучше</button>
      <button class="vote" data-vote="C" type="button">C лучше</button>
      <button class="vote" data-vote="NONE" type="button">Ни один</button>
    </div>
    <div id="savedMessage" class="saved"></div>
    <button id="nextButton" class="next" type="button" disabled>Следующий тест</button>
  </section>

  <div class="footer-tools">
    <button id="exportButton" class="export" type="button">Экспорт результатов</button>
  </div>
</main>

<script>
(() => {
  "use strict";

  const EXPERIMENT = "recommendation-ranking-v1";
  const API_PATH = "/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j";
  const API_ORIGINS = ["https://riffspectrum.com", "https://riffspectrum.ru"];
  const PARAMS = [
    { key: "heaviness", short: "HVY", label: "Heaviness" },
    { key: "speed", short: "SPD", label: "Speed" },
    { key: "melody", short: "MEL", label: "Melody" },
    { key: "drive", short: "DRV", label: "Drive" },
    { key: "complexity", short: "CMP", label: "Compositional Complexity" },
    { key: "aggression", short: "AGR", label: "Aggression" },
    { key: "darkness", short: "DRK", label: "Darkness" },
  ];
  const PARAM_KEYS = PARAMS.map((item) => item.key);
  const SESSION_ID_KEY = "rs.reco-eval-v1.session-id";
  const SEEN_SEEDS_KEY = "rs.reco-eval-v1.seen-seeds";
  const LAST_ARTIST_KEY = "rs.reco-eval-v1.last-artist";
  const FALLBACK_KEY = "rs.reco-eval-v1.fallback-results";
  const SUBMITTED_IDS_KEY = "rs.reco-eval-v1.submitted-test-ids";

  const els = {
    seedCard: document.getElementById("seedCard"),
    seedTitle: document.getElementById("seedTitle"),
    seedYear: document.getElementById("seedYear"),
    sourceProfile: document.getElementById("sourceProfile"),
    changeLine: document.getElementById("changeLine"),
    controls: document.getElementById("controls"),
    sliders: document.getElementById("sliders"),
    targetProfile: document.getElementById("targetProfile"),
    resetButton: document.getElementById("resetButton"),
    status: document.getElementById("status"),
    results: document.getElementById("results"),
    variantA: document.getElementById("variantA"),
    variantB: document.getElementById("variantB"),
    variantC: document.getElementById("variantC"),
    voteWrap: document.getElementById("voteWrap"),
    voteButtons: Array.from(document.querySelectorAll(".vote")),
    savedMessage: document.getElementById("savedMessage"),
    nextButton: document.getElementById("nextButton"),
    exportButton: document.getElementById("exportButton"),
  };

  let dataset = null;
  let apiOrigin = null;
  let albumById = new Map();
  let seed = null;
  let sourceProfile = null;
  let targetProfile = null;
  let changedParameter = null;
  let variants = null;
  let variantMapping = null;
  let testId = null;
  let decisionStartedAt = null;
  let voted = false;

  function uuid() {
    if (crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    return `rs-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
  }

  function readJson(storage, key, fallback) {
    try {
      const raw = storage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function writeJson(storage, key, value) {
    try { storage.setItem(key, JSON.stringify(value)); } catch {}
  }

  function getSessionId() {
    try {
      let value = sessionStorage.getItem(SESSION_ID_KEY);
      if (!value) {
        value = uuid();
        sessionStorage.setItem(SESSION_ID_KEY, value);
      }
      return value;
    } catch {
      return uuid();
    }
  }

  function randomIndex(length) {
    if (length <= 1) return 0;
    if (crypto && typeof crypto.getRandomValues === "function") {
      const max = Math.floor(0x100000000 / length) * length;
      const buffer = new Uint32Array(1);
      do { crypto.getRandomValues(buffer); } while (buffer[0] >= max);
      return buffer[0] % length;
    }
    return Math.floor(Math.random() * length);
  }

  function shuffle(values) {
    const copy = [...values];
    for (let index = copy.length - 1; index > 0; index -= 1) {
      const other = randomIndex(index + 1);
      [copy[index], copy[other]] = [copy[other], copy[index]];
    }
    return copy;
  }

  function normalizeArtist(value) {
    return String(value).trim().toLocaleLowerCase();
  }

  function validProfile(profile) {
    return profile && PARAM_KEYS.every((key) => Number.isInteger(profile[key]) && profile[key] >= 1 && profile[key] <= 10);
  }

  function profileText(profile) {
    return PARAMS.map((parameter) => `${parameter.short} ${profile[parameter.key]}`).join(" · ");
  }

  function viewportBucket() {
    if (window.innerWidth <= 820) return "mobile";
    if (window.innerWidth <= 1180) return "tablet";
    return "desktop";
  }

  async function loadDataset() {
    let lastError = null;
    for (const origin of API_ORIGINS) {
      try {
        const response = await fetch(`${origin}${API_PATH}/data`, {
          method: "GET",
          credentials: "omit",
          mode: "cors",
          cache: "no-store",
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        validateDataset(data);
        apiOrigin = origin;
        return data;
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error("Dataset unavailable");
  }

  function validateDataset(data) {
    if (!data || data.experiment !== EXPERIMENT || !Array.isArray(data.albums) || !Array.isArray(data.seedAlbumIds)) {
      throw new Error("Invalid evaluator dataset");
    }
    const keys = Array.isArray(data.parameters) ? data.parameters.map((item) => item.profileKey) : [];
    if (keys.length !== PARAM_KEYS.length || !keys.every((key, index) => key === PARAM_KEYS[index])) {
      throw new Error("Invalid parameter contract");
    }
    if (!data.albums.every((album) => album && typeof album.id === "string" && typeof album.artist === "string" && typeof album.title === "string" && Number.isInteger(album.year) && validProfile(album.profile))) {
      throw new Error("Invalid album profile data");
    }
  }

  function chooseSeed() {
    const debugSeed = new URL(location.href).searchParams.get("seed");
    const seedPool = dataset.seedAlbumIds.map((id) => albumById.get(id)).filter(Boolean);
    if (!seedPool.length) return null;

    if (debugSeed) {
      const fixed = albumById.get(debugSeed);
      if (fixed && dataset.seedAlbumIds.includes(fixed.id)) return fixed;
      return null;
    }

    let seen = new Set(readJson(sessionStorage, SEEN_SEEDS_KEY, []));
    let available = seedPool.filter((album) => !seen.has(album.id));
    if (!available.length) {
      seen = new Set();
      available = [...seedPool];
    }

    let lastArtist = null;
    try { lastArtist = sessionStorage.getItem(LAST_ARTIST_KEY); } catch {}
    if (lastArtist) {
      const alternatives = available.filter((album) => normalizeArtist(album.artist) !== lastArtist);
      if (alternatives.length) available = alternatives;
    }

    const picked = available[randomIndex(available.length)];
    seen.add(picked.id);
    writeJson(sessionStorage, SEEN_SEEDS_KEY, [...seen]);
    try { sessionStorage.setItem(LAST_ARTIST_KEY, normalizeArtist(picked.artist)); } catch {}
    return picked;
  }

  function clearTestState() {
    changedParameter = null;
    variants = null;
    variantMapping = null;
    testId = uuid();
    decisionStartedAt = null;
    voted = false;
    els.results.hidden = true;
    els.voteWrap.hidden = true;
    els.savedMessage.textContent = "";
    els.nextButton.disabled = true;
    els.voteButtons.forEach((button) => {
      button.disabled = true;
      button.classList.remove("selected");
    });
  }

  function startTest() {
    clearTestState();
    seed = chooseSeed();
    if (!seed) {
      showFatal("Не удалось выбрать тестовый альбом.");
      return;
    }
    sourceProfile = { ...seed.profile };
    targetProfile = { ...seed.profile };
    renderSeed();
    renderSliders();
    els.seedCard.hidden = false;
    els.controls.hidden = false;
    els.status.className = "status";
    els.status.textContent = "Измените один параметр, чтобы сформировать варианты.";
  }

  function renderSeed() {
    els.seedTitle.textContent = `${seed.artist} — ${seed.title}`;
    els.seedYear.textContent = String(seed.year);
    els.sourceProfile.textContent = profileText(sourceProfile);
    els.targetProfile.textContent = profileText(targetProfile);
    els.changeLine.textContent = changedParameter
      ? `${PARAMS.find((item) => item.key === changedParameter).label}: ${sourceProfile[changedParameter]} → ${targetProfile[changedParameter]}`
      : "";
  }

  function renderSliders() {
    els.sliders.replaceChildren();
    for (const parameter of PARAMS) {
      const row = document.createElement("div");
      row.className = "slider-row";
      const label = document.createElement("label");
      label.htmlFor = `slider-${parameter.key}`;
      label.textContent = parameter.short;
      const input = document.createElement("input");
      input.type = "range";
      input.id = `slider-${parameter.key}`;
      input.min = "1";
      input.max = "10";
      input.step = "1";
      input.value = String(targetProfile[parameter.key]);
      input.dataset.parameter = parameter.key;
      input.disabled = Boolean(changedParameter && changedParameter !== parameter.key) || voted;
      const output = document.createElement("output");
      output.htmlFor = input.id;
      output.textContent = input.value;

      input.addEventListener("input", () => {
        if (voted) return;
        const key = input.dataset.parameter;
        if (!changedParameter && Number(input.value) !== sourceProfile[key]) {
          changedParameter = key;
          disableOtherSliders();
        }
        targetProfile[key] = Number(input.value);
        output.textContent = input.value;
        renderSeed();
        els.resetButton.disabled = PARAM_KEYS.every((name) => targetProfile[name] === sourceProfile[name]);
      });

      input.addEventListener("change", () => {
        if (voted) return;
        const key = input.dataset.parameter;
        targetProfile[key] = Number(input.value);
        if (targetProfile[key] === sourceProfile[key]) {
          resetProfile();
          return;
        }
        changedParameter = key;
        disableOtherSliders();
        commitTargetProfile();
      });

      row.append(label, input, output);
      els.sliders.append(row);
    }
    els.resetButton.disabled = !changedParameter;
  }

  function disableOtherSliders() {
    els.sliders.querySelectorAll('input[type="range"]').forEach((input) => {
      input.disabled = voted || (changedParameter && input.dataset.parameter !== changedParameter);
    });
  }

  function resetProfile() {
    if (voted) return;
    targetProfile = { ...sourceProfile };
    changedParameter = null;
    variants = null;
    variantMapping = null;
    decisionStartedAt = null;
    els.results.hidden = true;
    els.voteWrap.hidden = true;
    els.changeLine.textContent = "";
    els.targetProfile.textContent = profileText(targetProfile);
    els.status.className = "status";
    els.status.textContent = "Измените один параметр, чтобы сформировать варианты.";
    renderSliders();
  }

  function candidateCatalog() {
    const seedArtist = normalizeArtist(seed.artist);
    return dataset.albums.filter((album) => album.id !== seed.id && normalizeArtist(album.artist) !== seedArtist);
  }

  function productionSimilarity(candidate) {
    const weightedDifference = dataset.parameters.reduce((sum, parameter) => {
      return sum + Math.abs(targetProfile[parameter.profileKey] - candidate.profile[parameter.profileKey]) * parameter.weight;
    }, 0);
    const weightSum = dataset.parameters.reduce((sum, parameter) => sum + parameter.weight, 0);
    const averageDifference = weightedDifference / weightSum;
    return Math.max(0, Math.round(100 - averageDifference * 10));
  }

  function compareText(left, right) {
    return left.localeCompare(right);
  }

  function rankM1(candidates) {
    return candidates
      .map((album, sourceIndex) => ({ album, sourceIndex, score: productionSimilarity(album) }))
      .sort((left, right) =>
        right.score - left.score ||
        compareText(left.album.artist, right.album.artist) ||
        compareText(left.album.title, right.album.title) ||
        left.sourceIndex - right.sourceIndex
      )
      .slice(0, 6)
      .map((item) => item.album);
  }

  function rankM2(candidates) {
    const changed = changedParameter;
    return candidates
      .map((album) => {
        const distance = PARAM_KEYS.reduce((sum, key) => {
          const weight = key === changed ? 5 : 1;
          return sum + Math.abs(targetProfile[key] - album.profile[key]) * weight;
        }, 0);
        return { album, distance };
      })
      .sort((left, right) =>
        left.distance - right.distance ||
        compareText(left.album.artist, right.album.artist) ||
        compareText(left.album.title, right.album.title) ||
        compareText(left.album.id, right.album.id)
      )
      .slice(0, 6)
      .map((item) => item.album);
  }

  function rankM3(candidates) {
    const changed = changedParameter;
    const targetValue = targetProfile[changed];
    let band = 0;
    let pool = [];
    while (band <= 9) {
      pool = candidates.filter((album) => Math.abs(album.profile[changed] - targetValue) <= band);
      if (pool.length >= 6) break;
      band += 1;
    }

    const otherKeys = PARAM_KEYS.filter((key) => key !== changed);
    return pool
      .map((album) => ({
        album,
        secondaryDistance: otherKeys.reduce((sum, key) => sum + Math.abs(targetProfile[key] - album.profile[key]), 0),
        changedDistance: Math.abs(targetValue - album.profile[changed]),
      }))
      .sort((left, right) =>
        left.secondaryDistance - right.secondaryDistance ||
        left.changedDistance - right.changedDistance ||
        compareText(left.album.artist, right.album.artist) ||
        compareText(left.album.title, right.album.title) ||
        compareText(left.album.id, right.album.id)
      )
      .slice(0, 6)
      .map((item) => item.album);
  }

  function commitTargetProfile() {
    const candidates = candidateCatalog();
    const methods = {
      M1: rankM1(candidates),
      M2: rankM2(candidates),
      M3: rankM3(candidates),
    };
    if (Object.values(methods).some((items) => items.length !== 6)) {
      variants = null;
      variantMapping = null;
      els.results.hidden = true;
      els.voteWrap.hidden = true;
      els.status.className = "status error";
      els.status.textContent = "Не удалось сформировать полный набор рекомендаций.";
      return;
    }

    const permutation = shuffle(["M1", "M2", "M3"]);
    variantMapping = { A: permutation[0], B: permutation[1], C: permutation[2] };
    variants = {
      A: methods[variantMapping.A],
      B: methods[variantMapping.B],
      C: methods[variantMapping.C],
    };
    decisionStartedAt = performance.now();
    voted = false;
    renderResults();
  }

  function renderRecommendation(album) {
    const card = document.createElement("article");
    card.className = "rec";
    const title = document.createElement("div");
    title.className = "rec-title";
    title.textContent = `${album.artist} — ${album.title}`;
    const year = document.createElement("div");
    year.className = "rec-year";
    year.textContent = String(album.year);
    const profile = document.createElement("div");
    profile.className = "rec-profile";
    profile.textContent = profileText(album.profile);
    card.append(title, year, profile);
    return card;
  }

  function renderVariant(container, albums) {
    container.replaceChildren(...albums.map(renderRecommendation));
  }

  function renderResults() {
    renderSeed();
    renderVariant(els.variantA, variants.A);
    renderVariant(els.variantB, variants.B);
    renderVariant(els.variantC, variants.C);
    els.results.hidden = false;
    els.voteWrap.hidden = false;
    els.status.className = "status";
    els.status.textContent = "Сравните три набора и выберите лучший.";
    els.savedMessage.textContent = "";
    els.nextButton.disabled = true;
    els.voteButtons.forEach((button) => {
      button.disabled = false;
      button.classList.remove("selected");
    });
  }

  function buildResult(winner) {
    const method = winner === "NONE" ? "NONE" : variantMapping[winner];
    const toValue = targetProfile[changedParameter];
    const fromValue = sourceProfile[changedParameter];
    return {
      experiment: EXPERIMENT,
      test_id: testId,
      timestamp: new Date().toISOString(),
      session_id: getSessionId(),
      seed_album_id: seed.id,
      seed_artist: seed.artist,
      seed_title: seed.title,
      changed_parameter: changedParameter,
      from_value: fromValue,
      to_value: toValue,
      change_delta: toValue - fromValue,
      change_magnitude: Math.abs(toValue - fromValue),
      target_hvy: targetProfile.heaviness,
      target_spd: targetProfile.speed,
      target_mel: targetProfile.melody,
      target_drv: targetProfile.drive,
      target_cmp: targetProfile.complexity,
      target_agr: targetProfile.aggression,
      target_drk: targetProfile.darkness,
      variant_a_method: variantMapping.A,
      variant_b_method: variantMapping.B,
      variant_c_method: variantMapping.C,
      variant_a_album_ids: variants.A.map((album) => album.id),
      variant_b_album_ids: variants.B.map((album) => album.id),
      variant_c_album_ids: variants.C.map((album) => album.id),
      winner,
      winning_method: method,
      viewport_bucket: viewportBucket(),
      catalog_revision: dataset.source.catalogBlobSha || "unknown",
      app_release: dataset.source.appRelease || "unknown",
      decision_time_ms: Math.max(0, Math.round(performance.now() - decisionStartedAt)),
    };
  }

  function upsertFallback(result) {
    const current = readJson(localStorage, FALLBACK_KEY, []);
    const filtered = Array.isArray(current) ? current.filter((item) => item && item.test_id !== result.test_id) : [];
    filtered.push(result);
    writeJson(localStorage, FALLBACK_KEY, filtered);
  }

  function removeFallback(testIdToRemove) {
    const current = readJson(localStorage, FALLBACK_KEY, []);
    if (!Array.isArray(current)) return;
    writeJson(localStorage, FALLBACK_KEY, current.filter((item) => item && item.test_id !== testIdToRemove));
  }

  function markSubmitted(testIdToMark) {
    const ids = new Set(readJson(localStorage, SUBMITTED_IDS_KEY, []));
    ids.add(testIdToMark);
    writeJson(localStorage, SUBMITTED_IDS_KEY, [...ids].slice(-2000));
  }

  function alreadySubmitted(testIdToCheck) {
    return new Set(readJson(localStorage, SUBMITTED_IDS_KEY, [])).has(testIdToCheck);
  }

  async function transportResult(result) {
    const forceFailure = new URL(location.href).searchParams.get("analytics_fail") === "1";
    if (forceFailure) throw new Error("Forced analytics failure for QA");
    if (!apiOrigin) throw new Error("No evaluator API origin");
    const response = await fetch(`${apiOrigin}${API_PATH}/event`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "omit",
      mode: "cors",
      keepalive: true,
      body: JSON.stringify(result),
    });
    if (!response.ok) throw new Error(`Analytics HTTP ${response.status}`);
  }

  function submitVote(winner, button) {
    if (voted || !variants || alreadySubmitted(testId)) return;
    voted = true;
    disableOtherSliders();
    els.resetButton.disabled = true;
    els.voteButtons.forEach((item) => { item.disabled = true; });
    button.classList.add("selected");

    const result = buildResult(winner);
    upsertFallback(result);
    markSubmitted(testId);
    els.savedMessage.textContent = "Выбор сохранён";
    els.nextButton.disabled = false;

    transportResult(result)
      .then(() => removeFallback(result.test_id))
      .catch(() => {
        // The optimistic local copy remains as the required fallback.
      });
  }

  function exportFallback() {
    const results = readJson(localStorage, FALLBACK_KEY, []);
    const payload = {
      experiment: EXPERIMENT,
      exported_at: new Date().toISOString(),
      fallback_results: Array.isArray(results) ? results : [],
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `recommendation-ranking-v1-fallback-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  function showFatal(message) {
    els.seedCard.hidden = true;
    els.controls.hidden = true;
    els.results.hidden = true;
    els.voteWrap.hidden = true;
    els.status.className = "status error";
    els.status.textContent = message;
  }

  els.resetButton.addEventListener("click", resetProfile);
  els.voteButtons.forEach((button) => {
    button.addEventListener("click", () => submitVote(button.dataset.vote, button));
  });
  els.nextButton.addEventListener("click", () => {
    startTest();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  els.exportButton.addEventListener("click", exportFallback);

  loadDataset()
    .then((data) => {
      dataset = data;
      albumById = new Map(dataset.albums.map((album) => [album.id, album]));
      startTest();
    })
    .catch(() => showFatal("Не удалось выбрать тестовый альбом."));
})();
</script>
</body>
</html>
