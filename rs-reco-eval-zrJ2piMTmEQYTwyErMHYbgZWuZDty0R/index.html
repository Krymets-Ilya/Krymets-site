els.resetButton.addEventListener("click",resetProfile);els.modeButtons.forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));els.voteButtons.forEach(b=>b.addEventListener("click",()=>submitVote(b.dataset.vote,b)));els.nextButton.addEventListener("click",()=>{els.modeButtons.forEach(b=>b.disabled=false);startTest();scrollTo({top:0,behavior:"smooth"})});els.exportButton.addEventListener("click",exportFallback);loadDataset().then(d=>{dataset=d;albumById=new Map(d.albums.map(a=>[a.id,a]));startTest()}).catch(()=>fatal("Не удалось выбрать тестовый альбом."));
