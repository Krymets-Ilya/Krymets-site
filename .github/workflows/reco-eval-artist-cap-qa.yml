name: Recommendation evaluator artist cap QA
on:
  push:
    paths:
      - '.github/workflows/reco-eval-artist-cap-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/reco-cap-qa && cd /tmp/reco-cap-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify deployed evaluator artist cap
        env:
          PAGE_URL: https://krymets.ru/rs-reco-eval-zrJ2piMTmEQYTwyErMHYbgZWuZDty0R/?seed=metallica_master_of_puppets
        run: |
          set -euo pipefail
          cd /tmp/reco-cap-qa
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const norm = v => String(v).toLocaleLowerCase();
          async function setRange(page,key,value){await page.locator(`#slider-${key}`).evaluate((el,v)=>{el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));},value)}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:900}});
            const page=await ctx.newPage();
            let payload=null;
            page.on('request',req=>{if(req.url().includes('/event')&&req.method()==='POST'){try{payload=JSON.parse(req.postData())}catch{}}});
            await page.goto(process.env.PAGE_URL,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#slider-heaviness');
            assert.strictEqual(await page.locator('.mode.active').textContent(),'2 параметра');
            await setRange(page,'heaviness',3);
            await setRange(page,'melody',9);
            await page.waitForSelector('#results:not([hidden])');
            for(const id of ['variantA','variantB','variantC']){
              const cards=page.locator(`#${id} .rec-title`);
              assert.strictEqual(await cards.count(),6,`${id} must contain six albums`);
              const texts=await cards.allTextContents();
              const counts=new Map();
              for(const text of texts){const artist=text.split(' — ')[0];const key=norm(artist);counts.set(key,(counts.get(key)||0)+1);assert.notStrictEqual(key,norm('Metallica'),'seed artist leaked into results')}
              assert.ok(Math.max(...counts.values())<=2,`${id} exceeds artist cap: ${JSON.stringify(texts)}`);
            }
            assert.strictEqual(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);
            await page.locator('[data-vote=NONE]').click();
            await page.waitForFunction(()=>document.querySelector('#savedMessage')?.textContent.includes('Выбор сохранён'));
            await page.waitForTimeout(300);
            assert.ok(payload,'analytics payload missing');
            assert.strictEqual(payload.experiment,'recommendation-ranking-v4');
            assert.deepStrictEqual(new Set([payload.variant_a_method,payload.variant_b_method,payload.variant_c_method]),new Set(['M1','M2','M4R']));
            for(const key of ['variant_a_album_ids','variant_b_album_ids','variant_c_album_ids'])assert.strictEqual(payload[key].length,6);
            console.log('DEPLOYED_ARTIST_CAP=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa.js
