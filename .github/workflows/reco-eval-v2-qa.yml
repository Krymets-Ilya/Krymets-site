name: Recommendation evaluator v2 QA
on:
  push:
    paths:
      - '.github/workflows/reco-eval-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/reco-qa && cd /tmp/reco-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify server-side QA and mobile UI
        env:
          PAGE_URL: https://krymets.ru/rs-reco-eval-zrJ2piMTmEQYTwyErMHYbgZWuZDty0R/?seed=metallica_master_of_puppets
          QA_URL: https://riffspectrum.ru/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j/qa-v2-once
        run: |
          set -euo pipefail
          qa=''
          for i in $(seq 1 12); do
            qa=$(curl -fsS --max-time 30 "$QA_URL" || true)
            if echo "$qa" | grep -q '"pass":true'; then break; fi
            sleep 10
          done
          echo "SERVER_QA=$qa"
          echo "$qa" | grep -q '"pass":true'
          echo "$qa" | grep -q '"orderIndependent":true'
          echo "$qa" | grep -q '"eventStatus":200'
          cd /tmp/reco-qa
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const pageUrl = process.env.PAGE_URL;
          async function setRange(page, key, value) {
            await page.locator(`#slider-${key}`).evaluate((el, v) => {
              el.value = String(v);
              el.dispatchEvent(new Event('input', { bubbles: true }));
              el.dispatchEvent(new Event('change', { bubbles: true }));
            }, value);
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const width of [360, 430]) {
              const context = await browser.newContext({ viewport: { width, height: 900 } });
              const page = await context.newPage();
              await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForSelector('#slider-heaviness');
              assert.strictEqual(await page.locator('.mode.active').textContent(), '2 параметра');
              assert.strictEqual(await page.locator('input[type=range]').count(), 7);
              assert.strictEqual(await page.locator('img').count(), 0);
              assert.strictEqual(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), true);
              await setRange(page, 'heaviness', 3);
              assert.match(await page.locator('#progress').textContent(), /1 из 2/);
              assert.strictEqual(await page.locator('#results').isHidden(), true);
              await setRange(page, 'melody', 9);
              await page.waitForSelector('#results:not([hidden])');
              assert.strictEqual(await page.locator('.rec').count(), 18);
              assert.strictEqual(await page.locator('input[type=range]:disabled').count(), 5);
              assert.match(await page.locator('#changes').textContent(), /Heaviness 7 → 3 \(-4\)/);
              assert.match(await page.locator('#changes').textContent(), /Melody 6 → 9 \(\+3\)/);
              assert.match(await page.locator('#targetProfile').textContent(), /HVY 3/);
              assert.match(await page.locator('#targetProfile').textContent(), /MEL 9/);
              assert.strictEqual(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), true);
              await page.locator('[data-vote=A]').click();
              await page.waitForFunction(() => document.querySelector('#savedMessage')?.textContent.includes('Выбор сохранён'));
              assert.strictEqual(await page.locator('#nextButton').isEnabled(), true);
              console.log(`MOBILE_${width}=PASS`);
              await context.close();
            }
            const context = await browser.newContext({ viewport: { width: 390, height: 900 } });
            const page = await context.newPage();
            await page.goto(pageUrl + '&analytics_fail=1', { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForSelector('#slider-heaviness');
            await setRange(page, 'heaviness', 10);
            await setRange(page, 'melody', 3);
            await page.waitForSelector('#results:not([hidden])');
            await page.locator('[data-vote=NONE]').click();
            await page.waitForTimeout(500);
            const fallback = await page.evaluate(() => JSON.parse(localStorage.getItem('rs.reco-eval-v1.fallback-results') || '[]'));
            assert.ok(fallback.some(x => x.experiment === 'recommendation-ranking-v2' && x.changed_parameter_count === 2));
            console.log('LOCAL_FALLBACK=PASS');
            await context.close();
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node qa.js
