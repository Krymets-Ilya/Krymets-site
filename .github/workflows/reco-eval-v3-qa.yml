name: Recommendation evaluator v3 M4 QA
on:
  push:
    paths:
      - '.github/workflows/reco-eval-v3-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/reco-qa && cd /tmp/reco-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify M4 semantics and deployed mobile evaluator
        env:
          PAGE_URL: https://krymets.ru/rs-reco-eval-zrJ2piMTmEQYTwyErMHYbgZWuZDty0R/?seed=metallica_master_of_puppets
        run: |
          set -euo pipefail
          cd /tmp/reco-qa
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const pageUrl = process.env.PAGE_URL;

          function zone(from, target, level = 0) {
            const direction = target > from ? 1 : -1;
            const edge = Math.max(1, Math.min(10, target + direction * (level + 1)));
            return { min: Math.min(target, edge), max: Math.max(target, edge) };
          }
          assert.deepStrictEqual(zone(4, 7, 0), { min: 7, max: 8 });
          assert.deepStrictEqual(zone(8, 3, 0), { min: 2, max: 3 });
          assert.deepStrictEqual(zone(7, 10, 0), { min: 10, max: 10 });
          assert.deepStrictEqual(zone(5, 1, 0), { min: 1, max: 1 });
          assert.deepStrictEqual(zone(4, 7, 1), { min: 7, max: 9 });
          assert.deepStrictEqual(zone(8, 3, 1), { min: 1, max: 3 });
          assert.ok(!(6 >= zone(4, 7, 0).min && 6 <= zone(4, 7, 0).max));
          assert.ok(!(4 >= zone(8, 3, 0).min && 4 <= zone(8, 3, 0).max));

          function rankSynthetic(items) {
            return [...items].sort((a,b) => a.continuity-b.continuity || b.exact-a.exact || a.name.localeCompare(b.name));
          }
          let ranked = rankSynthetic([
            {name:'A', value:7, continuity:4, exact:1},
            {name:'B', value:8, continuity:2, exact:0},
          ]);
          assert.strictEqual(ranked[0].name, 'B');
          ranked = rankSynthetic([
            {name:'A', value:7, continuity:2, exact:1},
            {name:'B', value:8, continuity:2, exact:0},
          ]);
          assert.strictEqual(ranked[0].name, 'A');
          ranked = rankSynthetic([
            {name:'exact2', continuity:2, exact:2},
            {name:'exact1', continuity:2, exact:1},
            {name:'exact0', continuity:2, exact:0},
          ]);
          assert.deepStrictEqual(ranked.map(x=>x.name), ['exact2','exact1','exact0']);
          ranked = rankSynthetic([
            {name:'exact', continuity:3, exact:2},
            {name:'neighbor', continuity:1, exact:0},
          ]);
          assert.strictEqual(ranked[0].name, 'neighbor');
          console.log('SYNTHETIC_M4=PASS');

          async function setRange(page, key, value) {
            await page.locator(`#slider-${key}`).evaluate((el, v) => {
              el.value = String(v);
              el.dispatchEvent(new Event('input', { bubbles: true }));
              el.dispatchEvent(new Event('change', { bubbles: true }));
            }, value);
          }

          function methodsFromPayload(payload) {
            const result = {};
            for (const letter of ['a','b','c']) {
              const method = payload[`variant_${letter}_method`];
              result[method] = payload[`variant_${letter}_album_ids`];
            }
            return result;
          }

          async function runTarget(browser, width, order, target, intercept = true, analyticsFail = false) {
            const context = await browser.newContext({ viewport: { width, height: 900 } });
            const page = await context.newPage();
            let captured = null;
            if (intercept) {
              await page.route('**/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j/event', async route => {
                captured = JSON.parse(route.request().postData());
                await route.fulfill({ status: 200, contentType: 'application/json', body: '{"ok":true}' });
              });
            } else {
              page.on('request', request => {
                if (request.url().includes('/event') && request.method() === 'POST') {
                  captured = JSON.parse(request.postData());
                }
              });
            }
            const url = pageUrl + (analyticsFail ? '&analytics_fail=1' : '');
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForSelector('#slider-heaviness');
            assert.strictEqual(await page.locator('.mode.active').textContent(), '2 параметра');
            assert.strictEqual(await page.locator('img').count(), 0);
            assert.strictEqual(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), true);
            for (const key of order) await setRange(page, key, target[key]);
            await page.waitForSelector('#results:not([hidden])');
            assert.strictEqual(await page.locator('.rec').count(), 18);
            assert.strictEqual(await page.locator('input[type=range]:disabled').count(), 5);
            assert.strictEqual(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), true);
            const visibleText = await page.locator('body').innerText();
            assert.ok(!visibleText.includes('Directional Tolerance'));
            assert.ok(!visibleText.includes('M4'));
            await page.locator('[data-vote=NONE]').click();
            await page.waitForFunction(() => document.querySelector('#savedMessage')?.textContent.includes('Выбор сохранён'));
            if (!analyticsFail) await page.waitForTimeout(700);
            if (analyticsFail) {
              const fallback = await page.evaluate(() => JSON.parse(localStorage.getItem('rs.reco-eval-v1.fallback-results') || '[]'));
              const item = fallback.find(x => x.experiment === 'recommendation-ranking-v3');
              assert.ok(item);
              captured = item;
            }
            assert.ok(captured, 'analytics payload was not captured');
            assert.strictEqual(captured.experiment, 'recommendation-ranking-v3');
            assert.strictEqual(captured.changed_parameter_count, 2);
            assert.deepStrictEqual(new Set([captured.variant_a_method,captured.variant_b_method,captured.variant_c_method]), new Set(['M1','M2','M4']));
            assert.ok(Number.isInteger(captured.m4_expansion_level));
            assert.ok(captured.m4_candidate_pool_size >= 6);
            assert.ok(Number.isInteger(captured.overlap_m1_m4));
            assert.ok(Number.isInteger(captured.overlap_m2_m4));
            await context.close();
            return captured;
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const targetA = { heaviness: 3, melody: 9 };
            const first = await runTarget(browser, 360, ['heaviness','melody'], targetA, true, false);
            const second = await runTarget(browser, 430, ['melody','heaviness'], targetA, true, false);
            assert.deepStrictEqual(methodsFromPayload(first), methodsFromPayload(second));
            assert.strictEqual(first.m4_expansion_level, second.m4_expansion_level);
            assert.strictEqual(first.m4_candidate_pool_size, second.m4_candidate_pool_size);
            assert.strictEqual(first.m4_parameter_1_zone_min, second.m4_parameter_1_zone_min);
            assert.strictEqual(first.m4_parameter_1_zone_max, second.m4_parameter_1_zone_max);
            assert.strictEqual(first.m4_parameter_2_zone_min, second.m4_parameter_2_zone_min);
            assert.strictEqual(first.m4_parameter_2_zone_max, second.m4_parameter_2_zone_max);
            console.log('ORDER_INVARIANCE=PASS');
            console.log(`MOBILE_360=PASS`);
            console.log(`MOBILE_430=PASS`);

            const real = await runTarget(browser, 390, ['heaviness','melody'], {heaviness:10,melody:3}, false, false);
            console.log(`REAL_EVENT_TEST_ID=${real.test_id}`);
            const fallback = await runTarget(browser, 390, ['heaviness','melody'], {heaviness:3,melody:9}, false, true);
            assert.strictEqual(fallback.experiment, 'recommendation-ranking-v3');
            console.log('LOCAL_FALLBACK=PASS');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node qa.js
