name: Recommendation export QA
on:
  push:
    paths:
      - '.github/workflows/reco-export-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/reco-export-qa && cd /tmp/reco-export-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify successful vote still exports
        env:
          PAGE_URL: https://krymets.ru/rs-reco-eval-zrJ2piMTmEQYTwyErMHYbgZWuZDty0R/?seed=metallica_master_of_puppets
        run: |
          cd /tmp/reco-export-qa
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          async function setRange(page,key,value){await page.locator(`#slider-${key}`).evaluate((el,v)=>{el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));},value)}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({acceptDownloads:true,viewport:{width:390,height:900}});
            const page=await context.newPage();
            await page.route('**/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j/event', route=>route.fulfill({status:200,contentType:'application/json',body:'{"ok":true}'}));
            await page.goto(process.env.PAGE_URL,{waitUntil:'networkidle',timeout:90000});
            await setRange(page,'heaviness',3); await setRange(page,'melody',9);
            await page.waitForSelector('#results:not([hidden])');
            await page.locator('[data-vote=A]').click();
            await page.waitForTimeout(400);
            const fallback=await page.evaluate(()=>JSON.parse(localStorage.getItem('rs.reco-eval-v1.fallback-results')||'[]'));
            assert.strictEqual(fallback.length,0,'successful transport must clear fallback');
            const [download]=await Promise.all([page.waitForEvent('download'),page.locator('#exportButton').click()]);
            const path=await download.path();
            const fs=require('fs'); const payload=JSON.parse(fs.readFileSync(path,'utf8'));
            assert.ok(Array.isArray(payload.results));
            assert.strictEqual(payload.results.length,1);
            assert.strictEqual(payload.results[0].experiment,'recommendation-ranking-v3');
            assert.strictEqual(payload.results[0].seed_album_id,'metallica_master_of_puppets');
            assert.ok(Array.isArray(payload.unsent_fallback_results));
            assert.strictEqual(payload.unsent_fallback_results.length,0);
            console.log('EXPORT_AFTER_SUCCESS=PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa.js
