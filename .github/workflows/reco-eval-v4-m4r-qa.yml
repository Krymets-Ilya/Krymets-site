name: Recommendation evaluator v4 M4R QA
on:
  push:
    paths:
      - '.github/workflows/reco-eval-v4-m4r-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/reco-v4-qa && cd /tmp/reco-v4-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify M4R semantics and deployed evaluator
        env:
          PAGE_URL: https://krymets.ru/rs-reco-eval-zrJ2piMTmEQYTwyErMHYbgZWuZDty0R/?seed=metallica_master_of_puppets
        run: |
          set -euo pipefail
          cd /tmp/reco-v4-qa
          cat > qa.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const PARAMS=['heaviness','speed','melody','drive','complexity','aggression','darkness'];
          const GROUPS=[['heaviness','drive','aggression'],['melody','complexity']];
          function zone(from,target,level=0){const d=target>from?1:-1;const edge=Math.max(1,Math.min(10,target+d*(level+1)));return{min:Math.min(target,edge),max:Math.max(target,edge)}}
          assert.deepStrictEqual(zone(4,7),{min:7,max:8}); assert.deepStrictEqual(zone(8,3),{min:2,max:3}); assert.deepStrictEqual(zone(7,10),{min:10,max:10}); assert.deepStrictEqual(zone(4,1),{min:1,max:1});
          function plan(source,target,changed){const changedSet=new Set(changed),sets=new Map();for(const key of changed){const dir=target[key]>source[key]?1:-1;for(const g of GROUPS){if(!g.includes(key))continue;for(const r of g){if(changedSet.has(r))continue;if(!sets.has(r))sets.set(r,new Set());sets.get(r).add(dir)}}}const related=[],neutral=[],expected={};for(const k of PARAMS){const s=sets.get(k);if(!s)continue;if(s.size===1){related.push(k);expected[k]=[...s][0]}else neutral.push(k)}const relSet=new Set(related);const protectedDims=PARAMS.filter(k=>!changedSet.has(k)&&!relSet.has(k));return{related,neutral,expected,protectedDims}}
          function score(candidate,source,target,changed){const p=plan(source,target,changed);const protectedDistance=p.protectedDims.reduce((s,k)=>s+Math.abs(candidate[k]-source[k]),0);let opposing=0,changedCount=0,magnitude=0,supportive=0;for(const k of p.related){const d=candidate[k]-source[k];if(!d)continue;changedCount++;magnitude+=Math.abs(d);if(Math.sign(d)===p.expected[k])supportive++;else opposing++}const exact=changed.reduce((s,k)=>s+(candidate[k]===target[k]?1:0),0);return[protectedDistance,opposing,changedCount,magnitude,-supportive,-exact]}
          const cmp=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
          const seedS={heaviness:5,speed:7,melody:6,drive:6,complexity:5,aggression:5,darkness:4},targetS={...seedS,heaviness:8};
          const A={...targetS,drive:6,aggression:5},B={...targetS,drive:8,aggression:7},C={...targetS,drive:4,aggression:3}; assert.ok(cmp(score(A,seedS,targetS,['heaviness']),score(B,seedS,targetS,['heaviness']))<0); assert.ok(cmp(score(B,seedS,targetS,['heaviness']),score(C,seedS,targetS,['heaviness']))<0);
          const supportive={...targetS,drive:7,aggression:5},opposing={...targetS,drive:5,aggression:5}; assert.ok(cmp(score(supportive,seedS,targetS,['heaviness']),score(opposing,seedS,targetS,['heaviness']))<0);
          const downTarget={...seedS,heaviness:3},downSupport={...downTarget,drive:5},downOppose={...downTarget,drive:7}; assert.ok(cmp(score(downSupport,seedS,downTarget,['heaviness']),score(downOppose,seedS,downTarget,['heaviness']))<0);
          const protectedBetter={...targetS,speed:8,drive:8,aggression:7},relatedPreserved={...targetS,speed:9,drive:6,aggression:5}; assert.ok(cmp(score(protectedBetter,seedS,targetS,['heaviness']),score(relatedPreserved,seedS,targetS,['heaviness']))<0);
          const conflictTarget={...seedS,heaviness:8,drive:4},conflictPlan=plan(seedS,conflictTarget,['heaviness','drive']); assert.deepStrictEqual(conflictPlan.related,[]); assert.deepStrictEqual(conflictPlan.neutral,['aggression']); assert.ok(conflictPlan.protectedDims.includes('aggression')); assert.deepStrictEqual(plan(seedS,{...seedS,speed:9},['speed']).related,[]); assert.deepStrictEqual(plan(seedS,{...seedS,darkness:7},['darkness']).related,[]); console.log('SYNTHETIC_M4R=PASS');

          const base={heaviness:7,speed:7,melody:6,drive:9,complexity:7,aggression:6,darkness:6};
          const album=(id,artist,profile)=>({id,artist,title:id,year:2000,profile:{...base,...profile}});
          const albums=[album('metallica_master_of_puppets','Metallica',{}),
            album('n1','Artist N1',{heaviness:3,melody:9}),album('n2','Artist N2',{heaviness:2,melody:9,drive:8,aggression:5}),album('n3','Artist N3',{heaviness:3,melody:10,complexity:8}),album('n4','Artist N4',{heaviness:2,melody:10,speed:6}),album('n5','Artist N5',{heaviness:3,melody:9,darkness:5}),album('n6','Artist N6',{heaviness:2,melody:9,drive:7,complexity:9}),album('same_artist','Metallica',{heaviness:3,melody:9}),
            album('c1','Artist C1',{heaviness:10,drive:5}),album('c2','Artist C2',{heaviness:10,drive:4,aggression:7}),album('c3','Artist C3',{heaviness:10,drive:5,aggression:5}),album('c4','Artist C4',{heaviness:10,drive:4,speed:8}),album('c5','Artist C5',{heaviness:10,drive:5,melody:7}),album('c6','Artist C6',{heaviness:10,drive:4,darkness:7}),album('misc','Artist Misc',{heaviness:6,speed:4,melody:4,drive:5,complexity:4,aggression:4,darkness:4})];
          const dataset={schemaVersion:4,experiment:'recommendation-ranking-v4',source:{catalogBlobSha:'qa-catalog',appRelease:'qa-release'},parameters:PARAMS.map((k,i)=>({id:k,profileKey:k,weight:1,order:i+1})),top100Artists:['Metallica'],seedAlbumIds:['metallica_master_of_puppets'],albums};
          async function setRange(page,key,value){await page.locator(`#slider-${key}`).evaluate((el,v)=>{el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));},value)}
          function byMethod(p){const out={};for(const l of ['a','b','c'])out[p[`variant_${l}_method`]]=p[`variant_${l}_album_ids`];return out}
          async function runDouble(browser,width,order,targetVals){const ctx=await browser.newContext({viewport:{width,height:900}});const page=await ctx.newPage();let payload=null;await page.route('**/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j/data',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(dataset)}));await page.route('**/api/internal/recommendation-eval-v1-q5jyxg2RKT2Z7vWjR2YQPt7j/event',async route=>{payload=JSON.parse(route.request().postData());await route.fulfill({status:200,contentType:'application/json',body:'{"ok":true}'})});await page.goto(process.env.PAGE_URL,{waitUntil:'domcontentloaded',timeout:90000});await page.waitForSelector('#slider-heaviness');assert.strictEqual(await page.locator('.mode.active').textContent(),'2 параметра');assert.strictEqual(await page.locator('img').count(),0);assert.strictEqual(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);for(const k of order)await setRange(page,k,targetVals[k]);await page.waitForSelector('#results:not([hidden])');assert.strictEqual(await page.locator('.rec').count(),18);assert.strictEqual(await page.locator('input[type=range]:disabled').count(),5);const body=await page.locator('body').innerText();assert.ok(!body.includes('M4R'));assert.ok(!body.includes('Related Continuity'));await page.locator('[data-vote=NONE]').click();await page.waitForFunction(()=>document.querySelector('#savedMessage')?.textContent.includes('Выбор сохранён'));await page.waitForTimeout(100);assert.ok(payload);assert.strictEqual(payload.experiment,'recommendation-ranking-v4');assert.deepStrictEqual(new Set([payload.variant_a_method,payload.variant_b_method,payload.variant_c_method]),new Set(['M1','M2','M4R']));assert.ok(Number.isInteger(payload.m4r_expansion_level));assert.ok(payload.m4r_candidate_pool_size>=6);assert.ok(Number.isInteger(payload.overlap_m2_m4r));for(const ids of Object.values(byMethod(payload)))assert.ok(!ids.includes('same_artist'));const history=await page.evaluate(()=>JSON.parse(localStorage.getItem('rs.reco-eval-v1.results-history')||'[]'));assert.ok(history.some(x=>x.test_id===payload.test_id));await ctx.close();return payload}
          (async()=>{const browser=await chromium.launch({headless:true});const target1={heaviness:3,melody:9};const p1=await runDouble(browser,360,['heaviness','melody'],target1),p2=await runDouble(browser,430,['melody','heaviness'],target1);assert.deepStrictEqual(byMethod(p1),byMethod(p2));assert.deepStrictEqual(p1.m4r_related_dimensions,['drive','complexity','aggression']);assert.deepStrictEqual(p1.m4r_protected_dimensions,['speed','darkness']);console.log('ORDER_INVARIANCE_NORMAL=PASS');const conflict={heaviness:10,drive:5};const c1=await runDouble(browser,390,['heaviness','drive'],conflict),c2=await runDouble(browser,390,['drive','heaviness'],conflict);assert.deepStrictEqual(byMethod(c1),byMethod(c2));assert.deepStrictEqual(c1.m4r_related_dimensions,[]);assert.deepStrictEqual(c1.m4r_neutralized_related_dimensions,['aggression']);assert.ok(c1.m4r_protected_dimensions.includes('aggression'));console.log('EXPLICIT_INTENT_CONFLICT=PASS');await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qa.js
